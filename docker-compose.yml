# Local dev / single-server deployment: socket-hub + its own Redis.
# To move Redis elsewhere later (dedicated node or managed service), drop the
# `redis` service and point REDIS_URL at the new host — no code change.
services:
  socket-hub:
    build: .
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # Provide the rest via an .env file (PROJECTS, CORS_ORIGINS, per-project secrets).
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
